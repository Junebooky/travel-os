<title>Travel OS 07-expense — current owner approved one-blue monochrome design</title><desc>Developer handoff concept, not a live screenshot. One primary blue #1B64DA, neutral UI only. Example amounts are illustrative.</desc><g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="#FFFFFF" /><rect x="0" y="0" width="390" height="131" rx="0" fill="#FFFFFF" /><text x="23" y="25" font-size="13" font-weight="700" fill="#191F28" >9:41</text><text x="358" y="25" font-size="12" font-weight="650" fill="#191F28" text-anchor="end">● ● ▰</text><text x="22" y="82" font-size="32" font-weight="400" fill="#191F28" >←</text><text x="71" y="83" font-size="27" font-weight="800" fill="#191F28" >지출 기록</text><text x="22" y="115" font-size="14" font-weight="500" fill="#6B7684" >실제로 사용한 금액을 입력해 주세요.</text><rect x="20" y="149" width="350" height="140" rx="18" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1" /><text x="40" y="185" font-size="13" font-weight="500" fill="#6B7684" >금액 · 일본 엔화</text><text x="40" y="248" font-size="38" font-weight="700" fill="#191F28" >1,200  엔</text><rect x="20" y="302" width="350" height="131" rx="18" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1" /><text x="40" y="336" font-size="13" font-weight="500" fill="#6B7684" >결제 수단 · 선택 사항</text><rect x="39" y="353" width="151" height="57" rx="13" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1" /><rect x="200" y="353" width="151" height="57" rx="13" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1" /><text x="114" y="389" font-size="16" font-weight="700" fill="#4E5968" text-anchor="middle">카드</text><text x="275" y="389" font-size="16" font-weight="700" fill="#4E5968" text-anchor="middle">현금</text><rect x="20" y="448" width="350" height="86" rx="18" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1" /><text x="40" y="488" font-size="17" font-weight="750" fill="#191F28" >장소 · 날짜 · 메모</text><text x="349" y="489" font-size="14" font-weight="750" fill="#1B64DA" text-anchor="end">입력  ›</text><rect x="20" y="548" width="350" height="96" rx="18" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1" /><text x="40" y="581" font-size="14" font-weight="700" fill="#191F28" >사진 OCR 가격은 후보값입니다.</text><text x="40" y="609" font-size="13" font-weight="500" fill="#6B7684" >실제로 결제한 금액으로 수정 가능</text><rect x="0" y="699" width="390" height="145" rx="0" fill="#FFFFFF" /><rect x="20" y="726" width="350" height="64" rx="13" fill="#1B64DA" /><text x="195" y="764.12" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1,200엔 지출 기록하기</text><text x="195" y="815" font-size="12" font-weight="550" fill="#4E5968" text-anchor="middle">기기 저장 성공 후에만 기록 완료 표시</text></g></svg>
