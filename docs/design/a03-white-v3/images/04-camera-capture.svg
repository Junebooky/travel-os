<title>Travel OS 04-camera-capture — proposed Light UI v3</title><desc>Developer handoff concept, not a screenshot of current software. Example data only.</desc><g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F2F4F6" /><rect x="0" y="0" width="390" height="131" rx="0" fill="#FFFFFF" /><text x="23" y="25" font-size="13" font-weight="700" fill="#191F28" >9:41</text><text x="358" y="25" font-size="12" font-weight="650" fill="#191F28" text-anchor="end">● ● ▰</text><text x="22" y="82" font-size="32" font-weight="400" fill="#191F28" >←</text><text x="71" y="83" font-size="27" font-weight="800" fill="#191F28" >메뉴 사진 번역</text><text x="22" y="115" font-size="14" font-weight="500" fill="#6B7684" >⌖  선택한 카페</text><rect x="134" y="263" width="122" height="122" rx="28" fill="#FFFFFF" /><text x="195" y="341" font-size="66" font-weight="450" fill="#1B64DA" text-anchor="middle">▧</text><text x="195" y="430" font-size="22" font-weight="800" fill="#191F28" text-anchor="middle">메뉴판을 촬영해 보세요</text><text x="195" y="461" font-size="15" font-weight="500" fill="#4E5968" text-anchor="middle">메뉴판 글자와 가격을 읽어드려요.</text><rect x="20" y="578" width="350" height="86" rx="18" fill="#FFFFFF" /><text x="36" y="606" font-size="13" font-weight="800" fill="#4E5968" >사진 처리 안내</text><text x="36" y="627" font-size="12" font-weight="500" fill="#4E5968" >사진은 앱 서버로 전송되며 외부 AI</text><text x="36" y="647" font-size="12" font-weight="500" fill="#4E5968" >분석 이용 시 그 서비스에도 전달돼요.</text><rect x="20" y="685" width="350" height="55" rx="13" fill="#1B64DA" /><text x="195" y="718.26" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">메뉴판 촬영</text><text x="195" y="766" font-size="15" font-weight="750" fill="#1B64DA" text-anchor="middle">앨범에서 선택하기</text></g></svg>
