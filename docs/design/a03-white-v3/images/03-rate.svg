<title>Travel OS 03-rate — current owner approved one-blue monochrome design</title><desc>Developer handoff concept, not a live screenshot. One primary blue #1B64DA, neutral UI only. Example amounts are illustrative.</desc><g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F2F4F6" /><rect x="0" y="0" width="390" height="131" rx="0" fill="#FFFFFF" /><text x="23" y="25" font-size="13" font-weight="700" fill="#191F28" >9:41</text><text x="358" y="25" font-size="12" font-weight="650" fill="#191F28" text-anchor="end">● ● ▰</text><text x="22" y="82" font-size="32" font-weight="400" fill="#191F28" >←</text><text x="71" y="83" font-size="27" font-weight="800" fill="#191F28" >환율 계산</text><text x="22" y="115" font-size="14" font-weight="500" fill="#6B7684" >⌖  선택한 카페 · 가격 확인</text><rect x="20" y="147" width="350" height="125" rx="18" fill="#FFFFFF" /><text x="42" y="184" font-size="13" font-weight="500" fill="#6B7684" >일본 엔화 · JPY</text><text x="42" y="220" font-size="30" font-weight="700" fill="#191F28" >¥ 1,200</text><text x="195" y="309" font-size="24" font-weight="750" fill="#1B64DA" text-anchor="middle">⇅</text><rect x="20" y="331" width="350" height="286" rx="18" fill="#FFFFFF" /><text x="42" y="367" font-size="13" font-weight="500" fill="#6B7684" >예상 원화 금액</text><text x="42" y="420" font-size="32" font-weight="700" fill="#191F28" >약 12,000원</text><text x="42" y="450" font-size="14" font-weight="800" fill="#4E5968" >지난 환율 기준</text><text x="42" y="476" font-size="13" font-weight="500" fill="#4E5968" >10월 16일 기준 · 제공처: 예시</text><text x="42" y="498" font-size="13" font-weight="500" fill="#6B7684" >현재 환율과 다를 수 있어요.</text><line x1="42" y1="528" x2="348" y2="528" stroke="#E5E8EB" stroke-width="1"/><text x="42" y="557" font-size="13" font-weight="500" fill="#4E5968" >인터넷 연결 후 새 환율 확인</text><text x="348" y="557" font-size="14" font-weight="750" fill="#1B64DA" text-anchor="end">다시 확인  ›</text><rect x="20" y="632" width="350" height="101" rx="18" fill="#FFFFFF" /><text x="40" y="662" font-size="13" font-weight="500" fill="#6B7684" >검증된 캐시가 없을 때</text><text x="40" y="688" font-size="16" font-weight="750" fill="#191F28" >환율 확인이 필요해요</text><text x="40" y="714" font-size="13" font-weight="500" fill="#6B7684" >기본 환율로 임의 계산하지 않음</text><rect x="0" y="774" width="390" height="70" rx="0" fill="#FFFFFF" /><g transform="translate(44 797)" fill="#8B95A1"><path d="M-11-11l8-3 6 2 8-3v25l-8 3-6-2-8 3z"/><path d="M-3-14v26M3-12v26" stroke="#FFFFFF" stroke-width="1.6" fill="none"/></g><text x="44" y="831" font-size="12" font-weight="600" fill="#8B95A1" text-anchor="middle">지도</text><g transform="translate(120 797)" fill="#8B95A1"><path d="M-12-10h19c4 0 5 2 5 5V6c0 3-2 5-5 5H-1l-8 5v-5h-3z"/><path d="M-6-3h12M-6 2h8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/></g><text x="120" y="831" font-size="12" font-weight="600" fill="#8B95A1" text-anchor="middle">번역</text><g transform="translate(196 797)" fill="#1B64DA"><circle r="12"/><path d="M-6-4h12M-6 0h12M-4-7l4 16 4-16" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="196" y="831" font-size="12" font-weight="800" fill="#1B64DA" text-anchor="middle">환율</text><g transform="translate(272 797)" fill="#8B95A1"><path d="M-12-8h22a3 3 0 0 1 3 3v13a4 4 0 0 1-4 4h-21z"/><path d="M2-3h13v10H2a5 5 0 0 1 0-10z" fill="#FFFFFF"/><circle cx="6" cy="2" r="2" /></g><text x="272" y="831" font-size="12" font-weight="600" fill="#8B95A1" text-anchor="middle">지갑</text><g transform="translate(348 797)" fill="#8B95A1"><path d="m-4-13 8 0 1 3 3 2 3-1 4 6-2 3 1 3 2 3-4 6-3-1-4 2-1 3h-8l-1-3-4-2-3 1-4-6 2-3-1-3-2-3 4-6 3 1 4-2z"/><circle r="4.5" fill="#FFFFFF"/></g><text x="348" y="831" font-size="12" font-weight="600" fill="#8B95A1" text-anchor="middle">설정</text></g></svg>
